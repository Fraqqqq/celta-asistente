name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      # Los tests usan un modelo guionado y Synapse/Telegram simulados: no gastan cuota
      # ni necesitan secretos. Las evaluaciones con Gemini real se corren a mano.
      - name: Tests
        run: pytest

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t celta-asistente .
